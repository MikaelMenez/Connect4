<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4 - IA Minimax & Poda Alfa-Beta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-amber-500 selection:text-black">
    <div class="w-full max-w-4xl mx-auto flex flex-col items-center gap-6">

        <!-- Cabeçalho -->
        <header class="text-center space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Inteligência Artificial
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-amber-400 via-yellow-300 to-rose-500 bg-clip-text text-transparent">
                Connect 4
            </h1>
            <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto">
                Desafie o algoritmo <span class="text-amber-400 font-semibold">Minimax</span> ou teste o poder da <span class="text-rose-400 font-semibold">Poda Alfa-Beta</span>.
            </p>
        </header>

        <!-- Barra de Configuração e Status -->
        <section class="w-full max-w-xl bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-2xl backdrop-blur-sm space-y-4">
            <!-- Seletor de Algoritmo -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                <span class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Algoritmo da IA:
                </span>
                <div class="inline-flex p-1 bg-slate-950/80 rounded-xl border border-slate-800 w-full sm:w-auto">
                    <button id="btn-minimax" type="button" class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 bg-amber-500 text-slate-950 shadow-md">
                        Minimax
                    </button>
                    <button id="btn-alphabeta" type="button" class="flex-1 sm:flex-initial px-4 py-2 rounded-lg text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all duration-200">
                        Poda Alfa-Beta
                    </button>
                </div>
            </div>

            <!-- Informações de Turno / Placar / Estado -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-center">
                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/50">
                    <span class="text-xs text-slate-400 block font-medium">Jogador (Você)</span>
                    <span class="inline-flex items-center gap-1.5 font-bold text-amber-400 text-sm mt-0.5">
                        <span class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.6)]"></span> Amarelo
                    </span>
                </div>
                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/50">
                    <span class="text-xs text-slate-400 block font-medium">IA (Oponente)</span>
                    <span class="inline-flex items-center gap-1.5 font-bold text-rose-500 text-sm mt-0.5">
                        <span class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]"></span> Vermelho
                    </span>
                </div>
                <div class="col-span-2 sm:col-span-1 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/50 flex flex-col justify-center">
                    <span class="text-xs text-slate-400 block font-medium">Endpoint Ativo</span>
                    <span id="active-endpoint-badge" class="font-mono text-xs font-semibold text-amber-300 truncate mt-0.5">
                        /turn_minimax
                    </span>
                </div>
            </div>

            <!-- Status do Jogo / Mensagens -->
            <div id="game-status" class="py-2.5 px-4 rounded-xl text-center text-sm font-semibold bg-slate-950/80 border border-slate-800 text-slate-200 flex items-center justify-center gap-2">
                <span>Sua vez de jogar! Clique em uma coluna.</span>
            </div>
        </section>

        <!-- Tabuleiro -->
        <main class="w-full max-w-xl flex flex-col items-center">
            <!-- Botões / Indicadores de seleção de coluna (hover/click) -->
            <div id="column-selectors" class="w-full grid grid-cols-7 gap-2 sm:gap-3 px-3 sm:px-4 mb-2">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <!-- Grade física do Connect 4 -->
            <div class="relative w-full bg-blue-700/90 p-3 sm:p-4 rounded-3xl shadow-[0_20px_50px_rgba(29,78,216,0.25)] border-4 border-blue-600/80 backdrop-blur-md">
                <div id="board" class="grid grid-cols-7 gap-2 sm:gap-3">
                    <!-- 42 slots gerados dinamicamente via JS (6 linhas x 7 colunas) -->
                </div>
            </div>
        </main>

        <!-- Ações do Rodapé -->
        <footer class="flex flex-wrap items-center justify-center gap-4 text-xs text-slate-500">
            <button id="btn-restart" type="button" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-slate-200 font-semibold text-sm transition-all duration-200 hover:scale-105 active:scale-95 shadow-lg">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reiniciar Tabuleiro
            </button>
        </footer>

    </div>

    <!-- Script Principal -->
    <script src="script.js"></script>
</body>
</html>
